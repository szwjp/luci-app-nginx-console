# Managed by luci-app-nginx-console.
#
# Shared zones for the limit_req / limit_conn directives that the console can
# write into a server section.  This file needs an http context, which is why
# it lives in conf.d as a .conf file: uci.conf.template ends its http block
# with "include conf.d/*.conf;".  The .locations files in the same directory
# are included per server instead and cannot hold these.
#
# The console only ever references these zone names, so the rates are edited
# here rather than per section.

limit_req_zone $binary_remote_addr zone=ncs_rl_5:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ncs_rl_20:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ncs_rl_100:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=ncs_cl:10m;
